[tool.poetry]
name = "peppol-invoicing"
version = "0.1.0"
description = "Generate EN16931-compliant e-invoices and human-readable PDF invoices"
authors = ["jtbr <jtbr@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "peppol_invoicing"}]

[tool.poetry.dependencies]
python = ">=3.10"
lxml = "^5.4"
python-dateutil = "^2.9"
python-docx = "^1.2"
requests = {version = "^2.31", optional = true}

[tool.poetry.extras]
peppol-sending = ["requests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
